name: Solana incident read-only storage and socket diagnosis
on:
  push:
    branches:
      - diag/solana-incident-storage-20261108
    paths:
      - .github/workflows/solana-storage-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public health snapshots without Solana RPC or changes
        shell: bash
        run: |
          set -Eeuo pipefail
          for n in 1 2; do
            curl --fail --silent --show-error --retry 2 --max-time 45 'https://solana-pump-radar-mvp.onrender.com/health' -o health.json
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(h.chain!=='solana'||h.mode!=='READ_ONLY')throw Error('UNEXPECTED_HEALTH');
          const c=h.metrics?.counters??{},g=h.metrics?.gauges??{},s=h.storage??{};
          const wanted=['storageBytes','event_observations','inbox','pending','deferred','errors','gaps'];
          console.log('SOLANA_INCIDENT_DIAG',JSON.stringify({
            measuredAt:h.metrics?.measuredAt,startedAt:h.startedAt,
            status:h.status,connected:g.websocket_connected,
            connectedAt:g.websocket_connected_at,disconnectedAt:g.websocket_disconnected_at,
            reason:g.websocket_last_disconnect_reason,code:g.websocket_last_transport_error_code,
            lastEvent:g.lastEventReceived||g.last_event_received,
            stream:h.logStream,storage:Object.fromEntries(wanted.map(k=>[k,s[k]??null])),
            disconnects:c.websocket_disconnects,reconnectCount:c.reconnect_count,
            notifications:c.log_notifications,persistenceFailures:c.persistenceFailures,
            processingFailures:c.processingFailures,errors:c.errors,
            coverageOverloaded:g.coverageOverloaded,rpcRequestsPerMinute:h.metrics?.rpcRequestsPerMinute
          }));
          NODE
            if [ "$n" = 1 ]; then sleep 15; fi
          done
